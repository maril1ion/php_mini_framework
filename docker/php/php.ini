; for $_ENV files
variables_order = "GPCSE"
; errors on production
display_errors = On
log_errors = On
error_reporting = E_ALL
; для загрузки файлов
; Максимальный размер загружаемых файлов (часто актуально при работе с ZIP/медиа)
upload_max_filesize = 100M
post_max_size = 100M
; Ограничение по памяти для скриптов
memory_limit = 512M

expose_php = Off